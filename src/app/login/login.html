<div class="login-wrapper">
  <img src="mindfuck-logo.png" alt="Mindfuck Logo" class="login-logo" />

<form ngNativeValidate (ngSubmit)="onSubmit()">
  <input type="text" name="email" [(ngModel)]="username" placeholder="vul hier je email in" required>
  <input type="password" name="password" [(ngModel)]="password" placeholder="vul hier je wachtwoord in" required>
  <button type="submit">Log in</button>
</form>
</div>
